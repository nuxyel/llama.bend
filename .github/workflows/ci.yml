name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"   # weekly, to catch changes in BendHub packages or in the toolchain

jobs:
  check:
    name: laws (--verdict), tokenizer, layer, forward and generation against transformers (SmolLM2-135M)
    runs-on: ubuntu-24.04      # pinned; 4 vCPU, 16 GB RAM, 14 GB disk
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache the Bend and Lean toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.bend
            ~/.elan
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}

      # only the download is cached (pinned revision); the weights, tables and the oracles' expected values are
      # written again on every run, so a test never compares against stale references
      - name: Cache the SmolLM2-135M download
        uses: actions/cache@v6
        with:
          path: data/smollm2-135m/hf
          key: hf-smollm2-135m-${{ hashFiles('reference/models.py') }}

      - name: Set up (Bend 2.0.37, Lean 4.34.0, Python venv)
        run: make setup

      - name: Prepare SmolLM2-135M
        run: make prep

      - name: Check (laws, prep, tokenizer, one layer, the forward pass, generation)
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: check.log
