name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"   # weekly, to catch changes in BendHub packages or in the toolchain

jobs:
  check:
    name: laws (--verdict), tokenizer, layer, forward and generation against transformers (SmolLM2-135M)
    runs-on: ubuntu-24.04      # pinned; 4 vCPU, 16 GB RAM, 14 GB disk
    timeout-minutes: 90
    env:
      SKIP_RTS_PROBE: 1        # 4 vCPU and noisy CPU time: the runtime's thread-count probe runs on the local machine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache the Bend and Lean toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.bend
            ~/.elan
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}

      # only the download is cached (pinned revision); the weights, tables and the oracles' expected values are
      # written again on every run, so a test never compares against stale references
      - name: Cache the SmolLM2-135M download
        uses: actions/cache@v6
        with:
          path: data/smollm2-135m/hf
          key: hf-smollm2-135m-${{ hashFiles('reference/models.py') }}

      - name: Set up (Bend 2.0.40, Lean 4.34.0, Python venv)
        run: make setup

      - name: Prepare SmolLM2-135M
        run: make prep

      - name: Check (laws, prep, tokenizer, one layer, the forward pass, generation)
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: check.log

  no-python:
    name: make bench without Python (scripts/fetch.sh, SmolLM2-135M)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # the gate is that nothing here needs Python: python and python3 fail, and say so, if anything calls them
      - name: Hide Python
        run: |
          mkdir -p "$RUNNER_TEMP/nopy"
          for p in python python3; do
            printf '#!/bin/sh\necho "%s called: this job must not need Python" >&2\nexit 99\n' "$p" > "$RUNNER_TEMP/nopy/$p"
            chmod +x "$RUNNER_TEMP/nopy/$p"
          done
          echo "$RUNNER_TEMP/nopy" >> "$GITHUB_PATH"

      - name: Cache Bend
        uses: actions/cache@v6
        with:
          path: ~/.bend
          key: bend-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}

      - name: Cache the SmolLM2-135M download
        uses: actions/cache@v6
        with:
          path: data/smollm2-135m/hf
          key: hf-smollm2-135m-fetch-${{ hashFiles('scripts/fetch.sh') }}

      - name: Set up Bend alone, fetch SmolLM2-135M, make bench
        run: |
          ! python3 -c 1 2>/dev/null
          make setup-bend fetch
          make bench | tee bench.log
          grep -q " ok$" bench.log
